<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaBuddy - Water Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">💧</div>
        <div>
          <h1 class="brand-title">AquaBuddy</h1>
          <p class="brand-subtitle">Smart Hydration Assistant</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <!-- Main Card: Next Reminder & Progress -->
    <section class="main-card">
      <div class="timer-section">
        <div class="timer-label">Next Reminder In</div>
        <div class="timer-countdown" id="timerCountdown">--:--</div>
        <div class="timer-subtext" id="timerSubtext">Interval: Every 30 mins</div>
      </div>

      <!-- Water Wave Progress Ring -->
      <div class="progress-container">
        <div class="progress-ring-wrap">
          <svg class="progress-ring" width="100" height="100">
            <circle class="progress-ring-bg" stroke="#e0f2fe" stroke-width="8" fill="transparent" r="42" cx="50" cy="50"/>
            <circle class="progress-ring-bar" id="progressRingBar" stroke="#0284c7" stroke-width="8" stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round" fill="transparent" r="42" cx="50" cy="50"/>
          </svg>
          <div class="progress-center-info">
            <span class="count-number" id="glassCount">0</span>
            <span class="count-goal" id="glassGoal">/ 8</span>
          </div>
        </div>
        <div class="progress-meta">
          <div class="meta-title">Today's Hydration</div>
          <div class="meta-percentage" id="metaPercentage">0% of daily goal</div>
          <button class="btn-quick-add" id="btnQuickAdd" title="Log a glass now">
            + Quick Sip 💧
          </button>
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="actions-grid">
      <button class="btn-primary" id="btnTestReminder">
        <span class="icon">✨</span>
        <span>Test Mascot Animation</span>
      </button>
    </div>

    <!-- Collapsible Settings Section -->
    <section class="settings-card">
      <div class="settings-header" id="settingsToggle">
        <span class="settings-title">⚙️ Reminder Settings</span>
        <span class="chevron" id="settingsChevron">▼</span>
      </div>

      <div class="settings-body" id="settingsBody">
        <div class="setting-item">
          <label for="intervalSelect">Reminder Interval (Minutes)</label>
          <input type="number" id="intervalSelect" class="form-input" min="1" max="180" value="30">
        </div>

        <div class="setting-item">
          <label for="snoozeSelect">Snooze / Remind Later (Minutes)</label>
          <input type="number" id="snoozeSelect" class="form-input" min="1" max="60" value="10">
        </div>

        <div class="setting-item">
          <label for="goalInput">Daily Goal (Glasses)</label>
          <input type="number" id="goalInput" class="form-input" min="1" max="20" value="8">
        </div>

        <div class="setting-item switch-item">
          <label for="soundToggle">Sound Effects</label>
          <label class="switch">
            <input type="checkbox" id="soundToggle" checked>
            <span class="slider round"></span>
          </label>
        </div>

        <div class="settings-actions">
          <button class="btn-secondary" id="btnSaveSettings">Save Settings</button>
          <button class="btn-text-danger" id="btnResetStats">Reset Today</button>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>AquaBuddy • Keeps you healthy & refreshed</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
