<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaBuddy - Settings & Character Size</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-emoji">💧</span>
        <div>
          <h2>AquaBuddy</h2>
          <p class="subtitle">Desktop Water Reminder & Mascot</p>
        </div>
      </div>
      <button class="btn-test-action" id="btnTestWalkTop" title="Test walking character now">
        <span>🚶 Test Walk</span>
      </button>
    </header>

    <!-- Character Size & Appearance Card -->
    <section class="card size-preview-card">
      <div class="card-header">
        <span class="card-title">🎭 Character Size & Appearance</span>
        <span class="scale-badge" id="scaleBadge">Scale: 1.4x (Large)</span>
      </div>

      <!-- Live Mascot Preview Window -->
      <div class="mascot-preview-box">
        <div class="preview-stage" id="previewStage">
          <!-- Live Preview of animated 3D mascot -->
          <div class="preview-mascot" id="previewMascot">
            <img src="../assets/norm_stand.png" class="preview-character-img" alt="AquaBuddy Preview">
          </div>
        </div>
      </div>

      <!-- Size Preset Buttons -->
      <div class="size-presets">
        <button class="btn-preset" data-scale="0.9" data-name="Small">Small (0.9x)</button>
        <button class="btn-preset" data-scale="1.2" data-name="Medium">Medium (1.2x)</button>
        <button class="btn-preset active" data-scale="1.4" data-name="Large">Large (1.4x)</button>
        <button class="btn-preset" data-scale="1.8" data-name="Extra Large">Extra Large (1.8x)</button>
      </div>

      <!-- Fine Scale Slider -->
      <div class="slider-group">
        <label for="scaleSlider">Custom Character Scale: <span id="sliderValue">1.4x</span></label>
        <input type="range" id="scaleSlider" min="0.8" max="2.2" step="0.1" value="1.4">
        <div class="slider-labels">
          <span>Compact</span>
          <span>Standard</span>
          <span>Extra Big</span>
        </div>
      </div>
    </section>

    <!-- Reminder Timers Card -->
    <section class="card">
      <h3 class="card-title">⏰ Hydration Schedule</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="intervalInput">Reminder Interval (Minutes)</label>
          <input type="number" id="intervalInput" class="input-box" min="1" max="180" value="30">
        </div>

        <div class="form-group">
          <label for="snoozeInput">Snooze / Remind Later (Minutes)</label>
          <input type="number" id="snoozeInput" class="input-box" min="1" max="60" value="10">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="goalInput">Daily Goal (Glasses)</label>
          <input type="number" id="goalInput" class="input-box" min="1" max="25" value="8">
        </div>

        <div class="form-group toggle-group">
          <label for="soundCheck">Sound Effects</label>
          <input type="checkbox" id="soundCheck" checked>
        </div>
      </div>
    </section>

    <!-- Daily Progress Summary -->
    <section class="card stats-card">
      <div class="stats-header">
        <div>
          <h3 class="card-title">📊 Today's Progress</h3>
          <p class="stats-counter" id="statsCounter">0 / 8 Glasses Drunk</p>
        </div>
        <button class="btn-secondary" id="btnResetStats">Reset Count</button>
      </div>
    </section>

    <!-- Bottom Actions -->
    <div class="footer-actions">
      <button class="btn-primary" id="btnSave">Save Preferences</button>
    </div>

  </div>

  <script src="settings.js"></script>
</body>
</html>
